# 웹 푸시 알림을 손으로 보내기 (push/send.ts): 시험 알림 · 미리 보기
# 매일 알림은 Firebase 예약 함수가 오전 10시 · 밤 10시 정각에 보낸다 (push/route/index.js).
# 필요한 설정 (저장소 Settings → Secrets and variables → Actions → Secrets):
#   - FIREBASE_SERVICE_ACCOUNT = Firebase 서비스 계정 키 JSON 전체
#   - VAPID_PRIVATE_KEY        = 알림 서명용 비밀 키 (.env.push.local 의 값)
# 설정 전에는 아무것도 안 하고 끝난다.
name: 웹 알림 (찜 · 새 공고)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '보낼 알림 (test: 최근 10분 안에 알림을 켠 기기에 시험 알림 / morning·evening: 그 알림을 바로)'
        type: choice
        options: [test, morning, evening]
        default: test
      dry_run:
        description: '보내지 않고 누구에게 무엇을 보낼지만 보기'
        type: boolean
        default: false

permissions:
  contents: read

# 늦게 시작한 실행이 겹쳐 같은 알림을 두 번 보내지 않게 한 번에 하나씩
concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push/package-lock.json

      - run: npm ci --prefix push

      - name: 알림 보내기
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          MODE: ${{ inputs.mode || 'test' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          TZ: Asia/Seoul
        run: npm run send --prefix push
