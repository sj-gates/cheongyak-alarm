<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>공고를 찾을 수 없어요 | 청약알림</title>
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1016" media="(prefers-color-scheme: dark)">
<script>
  // GitHub Pages 는 없는 주소 어디서든 이 파일을 보여 준다 → 사이트 루트를 주소에서 찾아 글꼴·스타일을 붙인다
  (function () {
    var p = location.pathname;
    var i = p.indexOf('/n/');
    var base = i >= 0 ? p.slice(0, i + 1) : p.indexOf('/cheongyak-alarm/') === 0 ? '/cheongyak-alarm/' : '/';
    window.SITE_BASE = base;
    document.write('<link rel="stylesheet" href="' + base + 'assets/style.css">');
    document.write('<link rel="icon" href="' + base + 'icons/icon-192.png">');
  })();
</script>
</head>
<body>
<header class="topbar">
  <a class="icon-btn" id="back" href="./" aria-label="공고 목록으로"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></a>
  <span class="sub-title">공고 상세</span>
</header>
<main class="container" id="view" style="padding-bottom:40px"></main>
<script type="module">
  // 목록에서 내려간 공고(모집공고 60일 지남)를 찜해 뒀다면 저장해 둔 내용을 보여 준다
  const base = window.SITE_BASE;
  const { CATEGORY_COLOR, badge, esc, getFavorites, rangeLabel, typeLabel, toggleFavorite } = await import(`${base}assets/common.js`);
  const view = document.getElementById('view');
  document.getElementById('back').href = base;

  const key = decodeURIComponent(location.pathname.match(/\/n\/([^/]+)\.html$/)?.[1] ?? '');
  const n = key ? getFavorites()[key] : null;

  if (n) {
    view.innerHTML = `
      <div class="hero">
        <div class="badges">${badge(typeLabel(n), CATEGORY_COLOR[n.category] ?? 'var(--primary)')}${badge(n.region, 'var(--sub)')}${badge('목록에서 내려감', 'var(--faint)')}</div>
        <h1>${esc(n.name)}</h1>
        <p class="address">${esc(n.address ?? '')}</p>
      </div>
      <div class="banner" style="margin-bottom:14px">모집공고일이 60일 넘게 지나 청약알림 목록에서 내려간 공고예요. 찜해 둔 때의 내용이에요.</div>
      <div class="section-title">청약 일정</div>
      <div class="card tight">
        ${(n.events ?? []).map((ev) => `<div class="info-row"><span class="k">${esc(ev.label)}</span><span class="v">${esc(rangeLabel(ev.start, ev.end))}</span></div>`).join('') || '<p class="hint" style="margin:0">일정 정보가 없어요.</p>'}
      </div>
      <div class="btn-row">
        <button class="btn secondary" id="unfav">찜 목록에서 빼기</button>
        <a class="btn ghost" href="https://www.applyhome.co.kr" target="_blank" rel="noopener">청약홈에서 찾아보기</a>
        <a class="btn ghost" href="${base}">다른 청약 공고 보기</a>
      </div>`;
    document.getElementById('unfav').addEventListener('click', () => {
      toggleFavorite(n);
      location.href = `${base}#/fav`;
    });
  } else {
    view.innerHTML = `
      <div class="empty" style="padding-top:80px">
        <div class="empty-icon"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg></div>
        <h2>공고를 찾을 수 없어요</h2>
        <p>목록에서 내려간 공고이거나 주소가 바뀌었어요.\n모집공고일이 60일 넘게 지난 공고는 목록에서 빠져요.</p>
      </div>
      <div class="btn-row"><a class="btn primary" href="${base}">청약 공고 보러 가기</a></div>`;
  }
</script>
</body>
</html>
